[package]
name = "o1-netconfd-rs"
version = "0.1.0"
edition = "2021"
description = "Memory-safe, crash-consistent Rust NETCONF server with durable RFC 6470/5277 write provenance and strict RFC 6241 confirmed-commit state machine"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.37"
russh = "0.49"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.15"
